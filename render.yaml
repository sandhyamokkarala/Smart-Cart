services:
  - type: web
    name: smartcart
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcart-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: smartcart-db
    databaseName: smartcart
    user: smartcart
    plan: free
    region: oregon